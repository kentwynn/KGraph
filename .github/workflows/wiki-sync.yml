name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - docs/wiki/**
      - .github/workflows/wiki-sync.yml
  workflow_dispatch:

jobs:
  sync:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync wiki files
        env:
          WIKI_TOKEN: ${{ secrets.KGRAPH_WIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "::warning title=Wiki sync skipped::GitHub Wiki repository is not available to this workflow yet. Create the wiki once in GitHub, or add a KGRAPH_WIKI_TOKEN secret with repository/wiki access, then rerun this workflow."
            exit 0
          fi

          rm -rf /tmp/kgraph-wiki
          git clone "$WIKI_URL" /tmp/kgraph-wiki
          rm -rf /tmp/kgraph-wiki/*

          cp docs/wiki/*.md /tmp/kgraph-wiki/
          git -C /tmp/kgraph-wiki config user.name "github-actions[bot]"
          git -C /tmp/kgraph-wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/kgraph-wiki add .

          if git -C /tmp/kgraph-wiki diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git -C /tmp/kgraph-wiki commit -m "Sync wiki from docs/wiki"
          git -C /tmp/kgraph-wiki push origin HEAD:master
